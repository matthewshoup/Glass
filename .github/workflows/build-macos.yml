name: macOS Universal Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Glass VST3 AU and Standalone
        run: bash ./scripts/build-macos.sh

      - name: Ad-hoc code sign Glass
        run: |
          set -euo pipefail
          ARTEFACTS="build/Glass_artefacts/Release"

          codesign --force --deep --sign - "$ARTEFACTS/VST3/Glass.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/Glass.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/Glass.app"

          codesign --verify --deep --strict --verbose=2 "$ARTEFACTS/VST3/Glass.vst3"
          codesign --verify --deep --strict --verbose=2 "$ARTEFACTS/AU/Glass.component"
          codesign --verify --deep --strict --verbose=2 "$ARTEFACTS/Standalone/Glass.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Glass-macOS-universal
          path: build/Glass_artefacts/Release/
