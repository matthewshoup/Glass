workflows:
  glass-macos:
    name: Glass macOS Universal
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Configure Glass
        script: |
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3 AU and Standalone
        script: |
          cmake --build build --config Release --target Glass_VST3 Glass_AU Glass_Standalone
      - name: Show built products
        script: |
          find build/Glass_artefacts/Release -maxdepth 4 -print || true
    artifacts:
      - build/Glass_artefacts/Release/**/*
